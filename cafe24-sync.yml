name: 카페24 매출 데이터 동기화

on:
  schedule:
    - cron: "*/30 * * * *" # 30분마다 실행 (UTC 기준, 필요시 주기 조절)
  workflow_dispatch: {} # Actions 탭에서 수동 실행 버튼 제공

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 카페24 데이터 가져오기
        id: fetch
        env:
          CAFE24_CLIENT_ID: ${{ secrets.CAFE24_CLIENT_ID }}
          CAFE24_CLIENT_SECRET: ${{ secrets.CAFE24_CLIENT_SECRET }}
          CAFE24_REFRESH_TOKEN: ${{ secrets.CAFE24_REFRESH_TOKEN }}
          CAFE24_MALL_ID: ${{ secrets.CAFE24_MALL_ID }}
        run: python scripts/fetch_cafe24.py

      - name: 변경사항 커밋 및 푸시
        run: |
          git config user.name "cafe24-sync-bot"
          git config user.email "actions@github.com"
          git add data/cafe24-orders.json
          git diff --quiet --cached || git commit -m "카페24 매출 데이터 갱신 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push

      - name: 새 refresh_token을 저장소 Secret에 반영
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh secret set CAFE24_REFRESH_TOKEN \
            --repo ${{ github.repository }} \
            --body "${{ steps.fetch.outputs.new_refresh_token }}"
